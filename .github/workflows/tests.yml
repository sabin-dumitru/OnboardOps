name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboardops-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check local environment preflight
        run: python scripts/preflight.py
      - name: Run unit and integration contract tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q app.py onboardops tests scripts
      - name: Exercise core console demo
        run: python scripts/demo.py
      - name: Exercise offline integration demo
        run: python scripts/integration_demo.py

  docker-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start hardened Compose demo
        run: docker compose up -d --build
      - name: Wait for Streamlit health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check runtime preflight and writable mounts
        run: docker compose exec -T onboardops python scripts/preflight.py
      - name: Create a synthetic case in the mounted database
        run: |
          docker compose exec -T onboardops python -c 'import os; from onboardops.cases import CaseStore; store=CaseStore(os.environ["ONBOARDOPS_CASE_DB"]); store.create_case(case_id="CASE-CI-100", lifecycle="onboarding", requester_id="ci-smoke", summary="Synthetic container smoke test", request_data={"synthetic": True}); store.close()'
      - name: Restart container and verify persisted case
        run: |
          docker compose restart onboardops
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              break
            fi
            sleep 2
          done
          docker compose exec -T onboardops python -c 'import os; from onboardops.cases import CaseStore; store=CaseStore(os.environ["ONBOARDOPS_CASE_DB"]); case=store.get_case("CASE-CI-100"); assert case["request_data"]["synthetic"] is True; store.close()'
      - name: Stop demo and remove CI volumes
        if: always()
        run: docker compose down --volumes

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboardops-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and integration contract tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q app.py onboardops tests scripts
      - name: Exercise core console demo
        run: python scripts/demo.py
      - name: Exercise offline integration demo
        run: python scripts/integration_demo.py
